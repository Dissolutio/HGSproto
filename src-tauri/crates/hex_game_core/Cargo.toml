[package]
name = "hex_game_core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0" # FOR TRANSIT PARSING
wasm-bindgen = "0.2"
# Target math crates can go here (e.g., glam or nalgebra for fast vector lookups)

[lib]
name = "hex_game_core"
crate-type = ["cdylib", "staticlib", "rlib"] # Supports WASM/native dynamic and native static linking

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory"]
