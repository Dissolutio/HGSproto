[package]
name = "hex_game_orchestrator"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hex_game_orchestrator"
path = "src/main.rs"

[dependencies]
hex_game_core = { path = "../hex_game_core" }
hex_game_network = { path = "../hex_game_network" }
futures-util = "0.3"
tokio = { version = "1.0", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync"] }
tokio-tungstenite = "0.26"

[dev-dependencies]
serde_json = "1.0"
tokio = { version = "1.0", features = ["time"] }
