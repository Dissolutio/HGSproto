[package]
name = "hex_game_network"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Universal Iroh peer-to-peer networking core engine
iroh = { version = "0.29" } 

# Conditional Wasm target grouping
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "Window"] }