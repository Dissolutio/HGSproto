[package]
name = "hex_game_tauri"
version = "0.1.0"
description = "HexGameSim Core App Wrapper Client"
edition = "2024" 

[lib]
name = "hex_game_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"] # Mandatory for Android JNI compilation

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Local Monorepo Workspace Dependencies
hex_game_core = { path = "crates/hex_game_core" }
hex_game_network = { path = "crates/hex_game_network" }
tauri-plugin-opener = "2.7.0"
